name: Sync Main to OLTP

on:
  repository_dispatch:
    types:
      - sync-main-to-oltp

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: sync-main-to-oltp
  cancel-in-progress: true

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  MAIN_SHA: ${{ github.event.client_payload.main_sha }}

jobs:
  sync:
    name: Merge main into oltp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          if [ -z "${MAIN_SHA}" ]; then
            echo "Missing repository_dispatch client_payload.main_sha" >&2
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "Missing secrets.GEMINI_API_KEY" >&2
            exit 1
          fi

      - name: Checkout oltp branch
        uses: actions/checkout@v7
        with:
          ref: oltp
          fetch-depth: 0
          persist-credentials: false

      - name: Enable corepack
        shell: bash
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch main and oltp
        shell: bash
        run: |
          git fetch --no-tags origin main oltp
          git rev-parse "${MAIN_SHA}^{commit}"

      - name: Skip if main is already synced
        id: synced
        shell: bash
        run: |
          if git merge-base --is-ancestor "${MAIN_SHA}" origin/oltp; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare merge state
        id: merge_state
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          git checkout -B oltp-sync origin/oltp

          if git merge --no-commit --no-ff "${MAIN_SHA}"; then
            echo "Clean merge without conflicts."
            echo "has_conflicts=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git ls-files -u | grep -q .; then
            echo "Merge encountered conflicts."
            echo "has_conflicts=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "git merge failed before conflict resolution" >&2
          exit 1

      - name: Set up Python
        if: steps.synced.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Aider
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: pip install aider-chat

      - name: Resolve merge conflicts with Gemini
        if: steps.synced.outputs.skip == 'false' && steps.merge_state.outputs.has_conflicts == 'true'
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
        run: |
          mapfile -t unmerged < <(git diff --name-only --diff-filter=U)

          if [ ${#unmerged[@]} -eq 0 ]; then
            echo "No unmerged files found."
            exit 0
          fi

          echo "Conflicted files: ${unmerged[*]}"

          code_files=()
          for f in "${unmerged[@]}"; do
            if [ "$f" = "yarn.lock" ]; then
              echo "Reconciling yarn.lock conflict via target branch version..."
              git checkout --ours yarn.lock
            else
              code_files+=("$f")
            fi
          done

          if [ ${#code_files[@]} -gt 0 ]; then
            echo "Resolving code conflicts with Aider: ${code_files[*]}"
            aider \
              --model gemini/gemini-3.7-flash \
              --no-auto-commits \
              --yes \
              --message "
              Resolve all git merge conflict markers in the specified files.

              Context:
              - Merging 'main' commit ${{ env.MAIN_SHA }} into branch 'oltp'.
              - Follow the repository guidelines in AGENTS.md.

              Requirements:
              - Completely remove all conflict markers (<<<<<<<, =======, >>>>>>>).
              - Maintain valid syntax and ensure all imports and type definitions are correct.
              - For package.json, ensure valid JSON and merge dependencies properly without duplicates.
              " \
              "${code_files[@]}"

            for f in "${code_files[@]}"; do
              if grep -qE '^(<{7}|={7}|>{7})' "$f"; then
                echo "::error::Conflict markers still remain in $f after Gemini resolution" >&2
                exit 1
              fi
            done

            git add "${code_files[@]}"
          fi

          yarn install
          git add yarn.lock

      - name: Verify merge is still pending
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          if git ls-files -u | grep -q .; then
            echo "Unmerged files remain after conflict resolution" >&2
            git status --short
            exit 1
          fi

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Expected an uncommitted merge, but MERGE_HEAD is missing" >&2
            git status --short
            exit 1
          fi

      - name: Validate and heal merge state
        if: steps.synced.outputs.skip == 'false'
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
        run: |
          yarn install

          heal_attempts=2
          for attempt in $(seq 1 $heal_attempts); do
            echo "Validating merge state (attempt ${attempt}/${heal_attempts})..."

            yarn run prettier --write .
            git add -u

            lint_error=""
            if ! lint_out=$(yarn lint 2>&1); then
              echo "Lint check failed on attempt $attempt:"
              echo "$lint_out"
              lint_error="$lint_out"
            fi

            if [ -n "$lint_error" ]; then
              if [ "$attempt" -lt "$heal_attempts" ]; then
                echo "Attempting to fix lint errors with Gemini..."
                mapfile -t changed_files < <(git diff --name-only origin/oltp)
                target_files=()
                for cf in "${changed_files[@]}"; do
                  if [[ "$cf" =~ \.(ts|tsx|js|mjs|cjs|json)$ && "$cf" != "yarn.lock" && -f "$cf" ]]; then
                    target_files+=("$cf")
                  fi
                done

                if [ ${#target_files[@]} -gt 0 ]; then
                  aider \
                    --model gemini/gemini-3.7-flash \
                    --no-auto-commits \
                    --yes \
                    --message "Fix the following lint errors according to AGENTS.md:
          ${lint_error}" \
                    "${target_files[@]}"
                  yarn run prettier --write .
                  git add -u
                fi
                continue
              else
                echo "::error::Lint check failed after healing attempts" >&2
                exit 1
              fi
            fi

            typecheck_error=""
            if ! typecheck_out=$(yarn typecheck 2>&1); then
              echo "Type check failed on attempt $attempt:"
              echo "$typecheck_out"
              typecheck_error="$typecheck_out"
            fi

            if [ -n "$typecheck_error" ]; then
              if [ "$attempt" -lt "$heal_attempts" ]; then
                echo "Attempting to fix typecheck errors with Gemini..."
                mapfile -t changed_files < <(git diff --name-only origin/oltp)
                target_files=()
                for cf in "${changed_files[@]}"; do
                  if [[ "$cf" =~ \.(ts|tsx|js|mjs|cjs|json)$ && "$cf" != "yarn.lock" && -f "$cf" ]]; then
                    target_files+=("$cf")
                  fi
                done

                if [ ${#target_files[@]} -gt 0 ]; then
                  aider \
                    --model gemini/gemini-3.7-flash \
                    --no-auto-commits \
                    --yes \
                    --message "Fix the following TypeScript typecheck errors according to AGENTS.md:
          ${typecheck_error}" \
                    "${target_files[@]}"
                  yarn run prettier --write .
                  git add -u
                fi
                continue
              else
                echo "::error::Type check failed after healing attempts" >&2
                exit 1
              fi
            fi

            build_error=""
            if ! build_out=$(yarn build 2>&1); then
              echo "Build failed on attempt $attempt:"
              echo "$build_out"
              build_error="$build_out"
            fi

            if [ -n "$build_error" ]; then
              if [ "$attempt" -lt "$heal_attempts" ]; then
                echo "Attempting to fix build errors with Gemini..."
                mapfile -t changed_files < <(git diff --name-only origin/oltp)
                target_files=()
                for cf in "${changed_files[@]}"; do
                  if [[ "$cf" =~ \.(ts|tsx|js|mjs|cjs|json)$ && "$cf" != "yarn.lock" && -f "$cf" ]]; then
                    target_files+=("$cf")
                  fi
                done

                if [ ${#target_files[@]} -gt 0 ]; then
                  aider \
                    --model gemini/gemini-3.7-flash \
                    --no-auto-commits \
                    --yes \
                    --message "Fix the following build errors according to AGENTS.md:
          ${build_error}" \
                    "${target_files[@]}"
                  yarn run prettier --write .
                  git add -u
                fi
                continue
              else
                echo "::error::Build failed after healing attempts" >&2
                exit 1
              fi
            fi

            echo "All validations passed successfully."
            break
          done

      - name: Create merge commit
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          git add -A

          git commit \
            -m "Merge branch 'main' into oltp" \
            -m "Source commit: ${MAIN_SHA}"

      - name: Push oltp
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "Missing secrets.PAT_TOKEN" >&2
            exit 1
          fi

          if [[ "${PAT_TOKEN}" == *$'\r'* || "${PAT_TOKEN}" == *$'\n'* ]]; then
            echo "secrets.PAT_TOKEN must not contain line breaks" >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "${PAT_TOKEN}" | base64 -w 0)"
          echo "::add-mask::${auth_header}"

          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            -c credential.helper= \
            push origin HEAD:oltp
