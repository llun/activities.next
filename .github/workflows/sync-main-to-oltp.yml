name: Sync Main to OLTP

on:
  repository_dispatch:
    types:
      - sync-main-to-oltp

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: sync-main-to-oltp
  cancel-in-progress: true

env:
  CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
  MAIN_SHA: ${{ github.event.client_payload.main_sha }}

jobs:
  sync:
    name: Merge main into oltp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          if [ -z "${MAIN_SHA}" ]; then
            echo "Missing repository_dispatch client_payload.main_sha" >&2
            exit 1
          fi

          if [ -z "${CLAUDE_API_KEY}" ]; then
            echo "Missing secrets.CLAUDE_API_KEY" >&2
            exit 1
          fi

      - name: Checkout oltp branch
        uses: actions/checkout@v7
        with:
          ref: oltp
          fetch-depth: 0
          persist-credentials: false

      - name: Enable corepack
        shell: bash
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch main and oltp
        shell: bash
        run: |
          git fetch --no-tags origin main oltp
          git rev-parse "${MAIN_SHA}^{commit}"

      - name: Skip if main is already synced
        id: synced
        shell: bash
        run: |
          if git merge-base --is-ancestor "${MAIN_SHA}" origin/oltp; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare merge state
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          git checkout -B oltp-sync origin/oltp

          if git merge --no-commit --no-ff "${MAIN_SHA}"; then
            exit 0
          fi

          if git ls-files -u | grep -q .; then
            exit 0
          fi

          echo "git merge failed before conflict resolution" >&2
          exit 1

      # anthropics/claude-code-action runs on Bun and installs it itself, in a
      # bundled `Install Bun` step that pulls the binary straight off the GitHub
      # release CDN with three closely-spaced retries and no fallback. Two syncs
      # on 2026-08-12 (runs 31638242964 and 31639748162) died right there with
      # `socket hang up`: the download gave up after ~37s, every later step of
      # the composite action was skipped, and the action's always-run post-step
      # then hit `bun: command not found` and reported exit code 127. That 127 is
      # the reported failure but not the cause — the cause is the failed
      # download, and the `Install Bun` entry showing `outcome=skipped` in those
      # logs is setup-bun's *post*-job step, which always skips.
      #
      # Installing Bun here instead and handing the action the path via
      # `path_to_bun_executable` disables its internal install outright (that
      # step carries `if: inputs.path_to_bun_executable == ''`) and puts the
      # download on a retry budget we control. `--retry-all-errors` is the part
      # that matters: a mid-transfer reset is not one of curl's default
      # retryable errors.
      #
      # BUN_VERSION tracks the `bun-version` that claude-code-action pins in its
      # own action.yml — check it after an upstream bump, since the action pins
      # deliberately to dodge Bun regressions. BUN_SHA256 is that release's
      # `bun-linux-x64.zip` entry from its SHASUMS256.txt and must be updated
      # together with the version. linux-x64 is hardcoded to match `runs-on`.
      - name: Install Bun
        id: bun
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        env:
          BUN_VERSION: '1.3.14'
          BUN_SHA256: '951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f'
        run: |
          bun_root="${RUNNER_TEMP}/bun"
          mkdir -p "${bun_root}"

          curl \
            --fail --location --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "${bun_root}/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"

          echo "${BUN_SHA256}  ${bun_root}/bun.zip" | sha256sum --check --quiet

          unzip -q "${bun_root}/bun.zip" -d "${bun_root}"

          bun_bin="${bun_root}/bun-linux-x64/bun"
          chmod +x "${bun_bin}"
          "${bun_bin}" --version

          echo "path=${bun_bin}" >> "${GITHUB_OUTPUT}"

      - name: Resolve and validate merge with Claude
        if: steps.synced.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          anthropic_api_key: ${{ env.CLAUDE_API_KEY }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          allowed_bots: github-actions
          prompt: |
            Resolve and validate a sync from `main` into `oltp`.

            Context:
            - Read and follow the repository's `AGENTS.md` file before making
              any changes.
            - The current local branch is `oltp-sync`.
            - It was created from `origin/oltp`.
            - A `git merge --no-commit --no-ff ${{ env.MAIN_SHA }}` has already
              been attempted.

            Requirements:
            - Resolve any merge conflicts or merge-related code issues.
            - Keep changes scoped to the merge.
            - Run `yarn install`, `yarn lint`, `yarn run prettier --check`, and
              `yarn build`.
            - Make the minimum changes needed for those commands to pass.
            - Do not create commits.
            - Do not push.
            - Do not open a pull request.
            - Leave the repository in a merge-in-progress state with no
              unmerged files so the workflow can create the final merge commit.
            - If you cannot reach that state, stop and fail.
          claude_args: |
            --model claude-sonnet-5
            --effort low
            --dangerously-skip-permissions
            --max-turns 40

      - name: Verify merge is still pending
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          if git ls-files -u | grep -q .; then
            echo "Unmerged files remain after Claude finished" >&2
            git status --short
            exit 1
          fi

          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Expected an uncommitted merge, but MERGE_HEAD is missing" >&2
            git status --short
            exit 1
          fi

      - name: Install dependencies
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: yarn install

      - name: Run lint
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: yarn lint

      - name: Check prettier formatting
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: yarn run prettier --check

      - name: Build
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: yarn build

      - name: Create merge commit
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        run: |
          git add -A

          git commit \
            -m "Merge branch 'main' into oltp" \
            -m "Source commit: ${MAIN_SHA}"

      - name: Push oltp
        if: steps.synced.outputs.skip == 'false'
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "Missing secrets.PAT_TOKEN" >&2
            exit 1
          fi

          if [[ "${PAT_TOKEN}" == *$'\r'* || "${PAT_TOKEN}" == *$'\n'* ]]; then
            echo "secrets.PAT_TOKEN must not contain line breaks" >&2
            exit 1
          fi

          auth_header="$(printf 'x-access-token:%s' "${PAT_TOKEN}" | base64 -w 0)"
          echo "::add-mask::${auth_header}"

          git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_header}" \
            -c credential.helper= \
            push origin HEAD:oltp
