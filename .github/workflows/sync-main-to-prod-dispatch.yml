name: Daily Main to Activities.prod Sync

# Syncs activities.prod with activities.next once a day instead of after every
# merge (feature merges and the automatic `Bump version to vX.Y.Z` merges each
# used to queue a full prod sync).
#
# The time is fixed in UTC on purpose, so it does not move with DST: 01:17 UTC is
# 02:17 in the Netherlands in winter (CET) and 03:17 in summer (CEST). It sits
# off the top of the hour because GitHub delays or drops more scheduled runs
# there. Scheduled workflows only run from the default branch.
#
# To sync sooner, run `sync-upstream.yml` by hand in activities.prod (optionally
# with a `main_sha`), or run this workflow by hand to apply the same selection.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-main-to-prod
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Sync Runner
    # Forks have no PAT_TOKEN and no business dispatching to activities.prod.
    if: github.repository == 'llun/activities.next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selection script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Picks the newest main commit on which CI, Package and CodeQL all
      # succeeded. The newest commit is often still in flight or was cancelled
      # by CI's cancel-in-progress, so look back through recent history rather
      # than skipping the day.
      - name: Select newest green main commit
        id: select
        uses: actions/github-script@v9
        env:
          LOOKBACK_COMMITS: '30'
        with:
          script: |
            const { REQUIRED_WORKFLOW_FILES, selectSyncCommit } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/select-sync-commit.mjs`
            )

            const { owner, repo } = context.repo

            const { data: commits } = await github.rest.repos.listCommits({
              owner,
              repo,
              sha: 'main',
              per_page: Number(process.env.LOOKBACK_COMMITS),
            })

            // 100 most recent push runs per workflow comfortably cover the
            // lookback window, including re-runs.
            const runs = []
            for (const [workflow, file] of Object.entries(REQUIRED_WORKFLOW_FILES)) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: file,
                branch: 'main',
                event: 'push',
                per_page: 100,
              })
              for (const run of data.workflow_runs) {
                runs.push({
                  workflow,
                  head_sha: run.head_sha,
                  run_attempt: run.run_attempt,
                  updated_at: run.updated_at,
                  status: run.status,
                  conclusion: run.conclusion,
                })
              }
            }

            const workflows = Object.keys(REQUIRED_WORKFLOW_FILES)
            const { sha, evaluated } = selectSyncCommit({
              commits: commits.map((commit) => commit.sha),
              runs,
              requiredWorkflows: workflows,
            })

            core.summary.addHeading('Daily Main-to-Activities.prod Sync')
            core.summary.addTable([
              [
                { data: 'Commit', header: true },
                ...workflows.map((workflow) => ({ data: workflow, header: true })),
              ],
              ...evaluated.map((entry) => [
                `<code>${entry.sha.slice(0, 12)}</code>${entry.sha === sha ? ' ✅' : ''}`,
                ...workflows.map((workflow) => entry.states[workflow]),
              ]),
            ])

            if (!sha) {
              const message =
                `No main commit in the last ${commits.length} has CI, Package ` +
                'and CodeQL all succeeded; skipping today\'s sync.'
              core.summary.addRaw(`\n${message}\n`)
              await core.summary.write()
              core.warning(message)
              core.setOutput('ready', 'false')
              return
            }

            core.summary.addRaw(`\nDispatching \`${sha}\` to activities.prod.\n`)
            await core.summary.write()
            core.info(`Selected ${sha}.`)
            core.setOutput('ready', 'true')
            core.setOutput('main_sha', sha)

      - name: Dispatch sync workflow
        if: steps.select.outputs.ready == 'true'
        uses: actions/github-script@v9
        env:
          MAIN_SHA: ${{ steps.select.outputs.main_sha }}
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'llun',
              repo: 'activities.prod',
              event_type: 'sync-upstream',
              client_payload: {
                main_sha: process.env.MAIN_SHA,
              },
            })
