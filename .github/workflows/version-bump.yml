name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  # This gate waits for a whole CI run, not just for checks to be attached:
  # "All Tests" is a fan-in job (`needs: [test-shards]`), so GitHub only creates
  # its check run once the four-way shard matrix has finished — minutes after
  # the PR is opened. 30 minutes covers a cold-cache run with headroom.
  CHECK_ATTEMPTS: 180
  CHECK_INTERVAL_SECONDS: 10
  # If *no* required check run at all has appeared after this many attempts, the
  # bot force-push likely did not trigger the pull_request CI workflows; reopen
  # the PR once to re-fire them. Two minutes is long enough that a merely slow
  # runner queue is not mistaken for workflows that never fired, and it is kept
  # well below CHECK_ATTEMPTS so the re-fired run still has time to pass.
  CHECK_KICK_ATTEMPT: 12
  # How many times to retry reopening the PR after a successful close, so a
  # transient reopen failure never leaves the bump PR closed.
  CHECK_REOPEN_ATTEMPTS: 3
  DEBOUNCE_SECONDS: 300
  VERSION_BUMP_BRANCH: version-bump/main

jobs:
  coalesce:
    name: Wait for merge batch
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump-coalesce-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      should_run: ${{ steps.latest-main.outputs.should_run }}
    steps:
      - name: Wait for nearby main merges
        run: sleep "$DEBOUNCE_SECONDS"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest main
        id: latest-main
        run: |
          set -euo pipefail

          git fetch --force origin main '+refs/tags/*:refs/tags/*'

          LATEST_SHA=$(git rev-parse origin/main)

          if [ "$GITHUB_SHA" != "$LATEST_SHA" ]; then
            echo "Skipping: $GITHUB_SHA is no longer the latest main commit ($LATEST_SHA)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_MSG=$(git log -1 --pretty=format:"%s" "$LATEST_SHA")
          if echo "$HEAD_MSG" | grep -qE '^Bump version to v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Skipping: latest main commit is already a version bump."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  version-bump:
    name: Bump Version
    needs: coalesce
    if: needs.coalesce.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: bump
        run: |
          set -euo pipefail

          git fetch --force origin main '+refs/tags/*:refs/tags/*'

          BASE_SHA=$(git rev-parse origin/main)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_SHA" != "$BASE_SHA" ]; then
            echo "Skipping: $GITHUB_SHA is no longer the latest main commit ($BASE_SHA)."
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_MSG=$(git log -1 --pretty=format:"%s" "$BASE_SHA")
          if echo "$HEAD_MSG" | grep -qE '^Bump version to v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Skipping: latest main commit is already a version bump."
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout --detach "$BASE_SHA"

          LATEST_TAG=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No existing version tag found. Will create v1.0.0."
            echo "bump=initial" >> "$GITHUB_OUTPUT"
            echo "commit_count=0" >> "$GITHUB_OUTPUT"
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
            echo "new_version=1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest reachable tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          COMMIT_HASHES=$(git log "$LATEST_TAG"..HEAD --pretty=format:"%H" --no-merges)

          if [ -z "$COMMIT_HASHES" ]; then
            echo "No new commits since $LATEST_TAG"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUMP="none"
          COMMIT_COUNT=0

          while IFS= read -r hash; do
            SUBJECT=$(git log -1 --pretty=format:"%s" "$hash")
            COMMIT_BUMP="patch"

            if echo "$SUBJECT" | grep -qE '^Bump version to v[0-9]+\.[0-9]+\.[0-9]+'; then
              continue
            fi

            COMMIT_COUNT=$((COMMIT_COUNT + 1))

            if echo "$SUBJECT" | grep -qE '^major:'; then
              COMMIT_BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^minor:'; then
              COMMIT_BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^none:'; then
              COMMIT_BUMP="none"
            else
              BODY=$(git log -1 --pretty=format:"%b" "$hash")
              BODY_BUMP=""

              if [ -n "$BODY" ]; then
                while IFS= read -r line; do
                  clean_line=$(echo "$line" | sed -E 's/^[[:space:]]*[-*][[:space:]]+//')

                  if echo "$clean_line" | grep -qE '^major:'; then
                    BODY_BUMP="major"
                    break
                  elif echo "$clean_line" | grep -qE '^minor:'; then
                    BODY_BUMP="minor"
                  fi
                done <<< "$BODY"
              fi

              if [ -n "$BODY_BUMP" ]; then
                COMMIT_BUMP="$BODY_BUMP"
              else
                CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --root "$hash")
                if [ -n "$CHANGED_FILES" ] && ! echo "$CHANGED_FILES" | grep -qvE '^(\.github/|$)'; then
                  COMMIT_BUMP="none"
                fi
              fi
            fi

            case "$COMMIT_BUMP" in
              major)
                BUMP="major"
                ;;
              minor)
                if [ "$BUMP" = "none" ] || [ "$BUMP" = "patch" ]; then
                  BUMP="minor"
                fi
                ;;
              patch)
                if [ "$BUMP" = "none" ]; then
                  BUMP="patch"
                fi
                ;;
            esac
          done <<< "$COMMIT_HASHES"

          if [ "$BUMP" = "none" ]; then
            echo "Skipping: no releasable commits found since $LATEST_TAG."
            echo "bump=none" >> "$GITHUB_OUTPUT"
            echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
            echo "new_version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Bump type: $BUMP"

          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 24
        if: steps.bump.outputs.new_version != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update package.json version
        if: steps.bump.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          node <<'NODE'
          const fs = require('fs')

          const packageJsonPath = 'package.json'
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'))
          packageJson.version = process.env.NEW_VERSION

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Create or update version bump PR
        if: steps.bump.outputs.new_version != ''
        env:
          BASE_SHA: ${{ steps.bump.outputs.base_sha }}
          BUMP: ${{ steps.bump.outputs.bump }}
          COMMIT_COUNT: ${{ steps.bump.outputs.commit_count }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          LATEST_TAG: ${{ steps.bump.outputs.latest_tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          git fetch --force origin main '+refs/tags/*:refs/tags/*'
          CURRENT_MAIN_SHA=$(git rev-parse origin/main)

          if [ "$CURRENT_MAIN_SHA" != "$BASE_SHA" ]; then
            echo "Skipping: main moved from $BASE_SHA to $CURRENT_MAIN_SHA before PR creation."
            exit 0
          fi

          git switch -C "$VERSION_BUMP_BRANCH"
          git add package.json

          if git diff --cached --quiet; then
            echo "No package.json changes; creating tag v${NEW_VERSION} directly."
            if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
              echo "Tag v${NEW_VERSION} already exists, skipping."
              exit 0
            fi

            git tag -a "v${NEW_VERSION}" -m "Version ${NEW_VERSION}" "$BASE_SHA"
            git push origin "v${NEW_VERSION}"
            exit 0
          fi

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PAT_TOKEN is required to push the bump branch and manage the PR."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^version-bump/v[0-9]+")) | .number' |
            while IFS= read -r pr_number; do
              if [ -n "$pr_number" ]; then
                echo "Closing stale version-specific bump PR #$pr_number."
                gh pr close "$pr_number" \
                  --comment "Closing this stale version-specific bump PR. Version bumps now use the stable ${VERSION_BUMP_BRANCH} branch." \
                  --delete-branch || true
              fi
            done

          git commit -m "Bump version to v${NEW_VERSION}"

          if git ls-remote --exit-code --heads origin "$VERSION_BUMP_BRANCH" >/dev/null 2>&1; then
            git fetch --force origin "refs/heads/${VERSION_BUMP_BRANCH}:refs/remotes/origin/${VERSION_BUMP_BRANCH}"
            REMOTE_BUMP_SHA=$(git rev-parse "refs/remotes/origin/${VERSION_BUMP_BRANCH}")
            git push --force-with-lease="refs/heads/${VERSION_BUMP_BRANCH}:${REMOTE_BUMP_SHA}" origin "$VERSION_BUMP_BRANCH"
          else
            git push --force-with-lease="refs/heads/${VERSION_BUMP_BRANCH}" origin "$VERSION_BUMP_BRANCH"
          fi

          BODY_FILE=$(mktemp)
          {
            echo "Automated version bump to v${NEW_VERSION}."
            echo
            echo "This PR batches unreleased commits on main and applies the highest required bump."
            echo
            echo "- Bump type: \`${BUMP}\`"
            if [ -n "${LATEST_TAG:-}" ]; then
              echo "- Base tag: \`${LATEST_TAG}\`"
            else
              echo "- Base tag: none"
            fi
            echo "- Base main SHA: \`${BASE_SHA}\`"
            echo "- Included commits: \`${COMMIT_COUNT}\`"
            echo
            echo "The merged bump commit will still be tagged by \`.github/workflows/tag-version.yml\`."
          } > "$BODY_FILE"

          EXISTING_PR=$(gh pr list --state open --base main --head "$VERSION_BUMP_BRANCH" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing version bump PR #${EXISTING_PR}."
            gh pr edit "$EXISTING_PR" \
              --title "Bump version to v${NEW_VERSION}" \
              --body-file "$BODY_FILE"
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          else
            PR_URL=$(gh pr create \
              --title "Bump version to v${NEW_VERSION}" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$VERSION_BUMP_BRANCH")
            echo "Created PR: $PR_URL"
          fi

          HEAD_SHA=$(git rev-parse HEAD)
          TAB=$(printf '\t')

          join_check_names() {
            local check_names="$1"

            if [ -z "$check_names" ]; then
              echo "(none)"
              return 0
            fi

            printf '%s\n' "$check_names" | paste -sd ',' - | sed 's/,/, /g'
          }

          read_branch_protection_required_checks() {
            local checks_error="$1"
            local gh_required_checks_exit
            local required_check_names

            : > "$checks_error"

            set +e
            # This endpoint only returns the branch-protection subset, which is
            # exactly the set that decides whether the PR can merge.
            #
            # .checks[] is the modern object array, while .contexts[] is the
            # legacy string array. Union them, then keep only non-empty strings
            # so either API shape produces the same required-check name set.
            required_check_names=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" \
              --jq '[.checks[]?.context, .contexts[]?] | map(select(type == "string" and length > 0)) | unique | .[]' 2> "$checks_error")
            gh_required_checks_exit=$?
            set -e

            if [ "$gh_required_checks_exit" -eq 0 ]; then
              printf '%s\n' "$required_check_names"
              return 0
            fi

            cat "$checks_error" >&2
            echo "::warning::Unable to read branch-protection required status checks." >&2

            return 1
          }

          # One "<name><TAB><status><TAB><conclusion>" line per check-run name on
          # the given commit, keeping only the newest run for each name (check
          # run ids increase with creation time).
          #
          # The dedupe is the point: several runs can attach a check run with the
          # same name to one head commit (a reopen, a manual re-run, a run
          # superseded by CI's cancel-in-progress concurrency). Branch protection
          # resolves a duplicated name to the newest run, but `gh pr checks` does
          # not — it reported the cancelled run's failed "All Tests" and never
          # looked at the green one, which is why this gate used to abandon every
          # bump PR.
          latest_check_run_states() {
            local sha="$1"

            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, (.id | tostring), .status, (.conclusion // "")] | @tsv' |
              sort -t"$TAB" -k1,1 -k2,2nr |
              awk -F"$TAB" 'BEGIN { OFS = "\t" } !seen[$1]++ { print $1, $3, $4 }'
          }

          # Wait until every branch-protection required check has a successful
          # run on the PR head commit.
          #
          # A required check that has no check run yet is PENDING, not missing.
          # CI's "All Tests" is a fan-in job (`needs: [test-shards]`), so GitHub
          # does not create its check run until the whole shard matrix finishes,
          # minutes into a perfectly healthy run. Treating that as "CI never
          # fired" is what made the self-heal reopen below fire on every bump PR:
          # the reopen cancelled the in-flight run, and the cancelled run's
          # "All Tests" job (`if: always()`) then failed permanently on that
          # commit, so the PR could never merge.
          wait_for_required_checks() {
            local pr_url="$1"
            local head_sha="$2"
            local required_check_names="$3"
            local attempt
            local conclusion
            local current_sha
            local failed
            local head_mismatches=0
            local kicked=0
            local pending
            local registered
            local reopen_attempt
            local reopened
            local required_check
            local states
            local states_ok
            local status

            for attempt in $(seq 1 "$CHECK_ATTEMPTS"); do
              current_sha=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)

              if [ -n "$current_sha" ] && [ "$current_sha" != "$head_sha" ]; then
                head_mismatches=$((head_mismatches + 1))

                # Believe a handover only after two consecutive reads. The PR
                # head is eventually consistent right after the force-push
                # above, so a single stale read still reports the *previous*
                # bump commit, and bailing on that would abandon a PR this run
                # does own.
                if [ "$head_mismatches" -ge 2 ]; then
                  echo "::warning::${pr_url} head moved from ${head_sha} to ${current_sha}; a newer version-bump run owns this PR."
                  return 1
                fi

                # Do not judge this commit's checks while the PR may already
                # point somewhere else — re-read before deciding anything. Left
                # to fall through, a green result on the stale commit would
                # return success for a head we no longer own.
                echo "${pr_url} head read as ${current_sha}, expected ${head_sha}; re-reading before judging checks."
                sleep "$CHECK_INTERVAL_SECONDS"
                continue
              fi

              head_mismatches=0

              if states=$(latest_check_run_states "$head_sha" 2> "$CHECKS_ERROR"); then
                states_ok=1
              else
                states_ok=0
                states=""
                cat "$CHECKS_ERROR" >&2
                echo "::warning::Unable to read check runs for ${head_sha}; retrying."
              fi

              failed=""
              pending=""
              registered=0

              while IFS= read -r required_check; do
                [ -n "$required_check" ] || continue

                # Pass the name through the environment, not `awk -v`: -v runs
                # the value through escape processing, so a check name
                # containing a backslash would never match itself and would sit
                # "pending" until the gate timed out.
                status=$(printf '%s\n' "$states" | name="$required_check" awk -F"$TAB" '$1 == ENVIRON["name"] { print $2 }')
                conclusion=$(printf '%s\n' "$states" | name="$required_check" awk -F"$TAB" '$1 == ENVIRON["name"] { print $3 }')

                if [ -n "$status" ]; then
                  registered=$((registered + 1))
                fi

                case "${status}/${conclusion}" in
                  completed/success) ;;
                  completed/cancelled | completed/skipped | completed/neutral | completed/)
                    # Not terminal. CI cancels superseded runs, so a cancelled
                    # check run means "a newer run is coming", and branch
                    # protection counts skipped and neutral as passing. An empty
                    # conclusion on a completed run is GitHub briefly reporting a
                    # run it has not finalized — treating that as a failure would
                    # abandon the PR on the first poll with no second look, since
                    # the failure branch below is the one terminal decision here
                    # that never retries. Waiting covers all four.
                    pending="${pending:+${pending}, }${required_check} (${conclusion:-not concluded})"
                    ;;
                  completed/*)
                    failed="${failed:+${failed}, }${required_check} (${conclusion:-unknown})"
                    ;;
                  *)
                    pending="${pending:+${pending}, }${required_check}"
                    ;;
                esac
              done <<< "$required_check_names"

              if [ -n "$failed" ]; then
                echo "::warning::Required PR checks did not succeed: ${failed}."
                return 1
              fi

              if [ -z "$pending" ]; then
                echo "All required PR checks passed: $(join_check_names "$required_check_names")."
                return 0
              fi

              # Self-heal: a bot force-push that updates the bump PR head
              # sometimes fails to trigger the pull_request CI workflows, so no
              # check run is ever created and the PR stays blocked forever.
              #
              # Reopening cancels whatever run is in flight, so only reopen on
              # unambiguous evidence that nothing fired: the commit must carry no
              # check runs *at all*, not merely none whose name we recognise. A
              # partially reported set means the remaining jobs have not been
              # queued yet, and a set of only unrecognised names means CI ran
              # under names this gate does not expect — reopening either one
              # would kill a healthy run and leave its cancelled jobs behind.
              if [ "$kicked" -eq 0 ] && [ "$states_ok" -eq 1 ] && [ "$registered" -eq 0 ] && [ -z "$states" ] && [ "$attempt" -ge "$CHECK_KICK_ATTEMPT" ]; then
                echo "No required check runs on ${head_sha} after ${attempt} attempts; reopening ${pr_url} to re-trigger CI."

                if gh pr close "$pr_url"; then
                  # Once closed, reopening is mandatory: a transient reopen
                  # failure must not leave the bump PR closed (worse than
                  # blocked), so retry until it succeeds or the budget is spent.
                  reopened=0
                  for reopen_attempt in $(seq 1 "$CHECK_REOPEN_ATTEMPTS"); do
                    if gh pr reopen "$pr_url"; then
                      reopened=1
                      break
                    fi
                    echo "::warning::Failed to reopen ${pr_url} (reopen ${reopen_attempt}/${CHECK_REOPEN_ATTEMPTS}); retrying in ${CHECK_INTERVAL_SECONDS}s."
                    sleep "$CHECK_INTERVAL_SECONDS"
                  done

                  if [ "$reopened" -eq 1 ]; then
                    kicked=1
                    echo "Reopened ${pr_url}; waiting for pull_request workflows to register."
                  else
                    echo "::error::Closed ${pr_url} but could not reopen it after ${CHECK_REOPEN_ATTEMPTS} attempts; reopen it manually to resume the version bump."
                    return 1
                  fi
                else
                  echo "::warning::Failed to close ${pr_url} to re-trigger CI; will retry on the next poll."
                fi
              fi

              echo "Waiting for required PR checks: ${pending} (${attempt}/${CHECK_ATTEMPTS})."
              sleep "$CHECK_INTERVAL_SECONDS"
            done

            echo "::warning::Timed out waiting for required PR checks; still pending: ${pending}."
            return 1
          }

          # Hand the PR to GitHub instead of dropping it whenever this run gives
          # up. Every abandon path used to exit having armed nothing, so the
          # bump then waited for an entirely new run — which only happens on the
          # next push to main, i.e. hours on a quiet day. Arming is safe even
          # for a bump whose version may be stale, because branch protection is
          # `strict`: an armed PR can merge only while it is both green *and*
          # up to date with main, and a stale bump goes BEHIND the moment main
          # moves, staying blocked until the next run force-pushes the
          # recomputed version onto it.
          arm_auto_merge() {
            local pr_url="$1"

            if gh pr merge --auto --squash --delete-branch "$pr_url"; then
              echo "Armed auto-merge on ${pr_url}; GitHub will merge it once branch protection is satisfied."
            else
              echo "::warning::Could not arm auto-merge on ${pr_url}."
            fi
          }

          CHECKS_ERROR=$(mktemp)
          trap 'rm -f "$CHECKS_ERROR"' EXIT

          set +e
          BRANCH_PROTECTION_CHECK_NAMES=$(read_branch_protection_required_checks "$CHECKS_ERROR")
          BRANCH_PROTECTION_CHECKS_EXIT=$?
          set -e

          if [ "$BRANCH_PROTECTION_CHECKS_EXIT" -ne 0 ] || [ -z "$BRANCH_PROTECTION_CHECK_NAMES" ]; then
            # With no expected set to wait on there is nothing to gate locally.
            # Enabling auto-merge is still safe: GitHub will not merge the PR
            # until branch protection is satisfied.
            echo "::warning::No branch-protection required status checks to wait on; relying on auto-merge to gate the merge."
          else
            echo "Branch-protection required checks: $(join_check_names "$BRANCH_PROTECTION_CHECK_NAMES")."

            if ! wait_for_required_checks "$PR_URL" "$HEAD_SHA" "$BRANCH_PROTECTION_CHECK_NAMES"; then
              echo "::warning::Required PR checks did not pass; leaving $PR_URL open."
              arm_auto_merge "$PR_URL"
              exit 0
            fi
          fi

          git fetch --force origin main
          LATEST_MAIN_SHA=$(git rev-parse origin/main)

          if [ "$LATEST_MAIN_SHA" != "$BASE_SHA" ]; then
            echo "Leaving $PR_URL open: main moved from $BASE_SHA to $LATEST_MAIN_SHA while checks were running."
            arm_auto_merge "$PR_URL"
            exit 0
          fi

          if gh pr merge --auto --squash --delete-branch "$PR_URL"; then
            echo "Enabled auto-merge for $PR_URL"
            exit 0
          fi

          # Auto-merge can only be *enabled* while the PR is still blocked, and
          # by now the required checks have usually all passed, so GitHub
          # rejects the request with "Pull request is in clean status". Merging
          # directly is the right answer for that case only — never for an
          # arbitrary --auto failure. PAT_TOKEN belongs to a repo admin and
          # `enforce_admins` is false on main, so a blind direct merge here
          # could push a bump past required checks this gate never verified
          # (most sharply on the "could not read branch protection" path above,
          # which does no local gating at all). Re-read the merge state and
          # merge only what GitHub itself already considers CLEAN.
          MERGE_STATE=""

          for merge_state_attempt in 1 2 3; do
            MERGE_STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || true)

            # UNKNOWN means GitHub has not finished computing mergeability yet,
            # not that the PR is unmergeable; the read itself kicks that off.
            if [ -n "$MERGE_STATE" ] && [ "$MERGE_STATE" != "UNKNOWN" ]; then
              break
            fi

            if [ "$merge_state_attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          if [ "$MERGE_STATE" = "CLEAN" ]; then
            echo "Auto-merge was refused and $PR_URL is CLEAN; merging it directly."
            gh pr merge --squash --delete-branch "$PR_URL"
            echo "Merged $PR_URL"
          else
            echo "::warning::Could not enable auto-merge for $PR_URL and its merge state is ${MERGE_STATE:-unreadable}; leaving it open."
          fi
