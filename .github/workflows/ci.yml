name: CI

# Runs on every commit (push to any branch + pull requests). The lint/prettier,
# typecheck, build, test, postgresql database test, schema-dump-sync, and docker-smoke jobs run in parallel (no `needs:` chain
# between them) so the check finishes as fast as the slowest single job instead
# of the sum of all of them. If any one of them fails, the run is reported as failed: the
# `CI / CI Success` job aggregates every job's result and fails unless all
# succeeded. Mark that job as the required status check in branch protection — it
# avoids the skipped-job-counts-as-passing gap that requiring the individual jobs
# would have. `cancel-in-progress` (below) also kills superseded runs so a new
# push fails fast past the old one.
#
# Everything runs in the normal push/pull_request context: jobs use the default
# read-only token, pull_request runs check out the PR merge ref (catching
# post-merge integration failures), and fork PRs are handled natively without a
# privileged workflow_run job executing untrusted code.

on:
  push:
  pull_request:

# Least privilege: every job only needs to read the repo to check it out. No job
# writes statuses, contents, or packages.
permissions:
  contents: read

# Cancel superseded runs for the same ref so rapid pushes don't pile up the full
# lint -> build -> test chain.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: Lint and Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Check prettier formatting
        run: yarn prettier:check

  # `next build` type-checks tsconfig.build.json, which excludes *.test.ts(x).
  # This job runs the same compiler over tsconfig.json (all files including
  # tests and scripts) via `yarn typecheck`.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type check
        run: yarn typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-v1-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.ts', 'tsconfig*.json', 'postcss.config.mjs', 'package.json', '.yarnrc.yml') }}-${{ hashFiles('app/**', 'lib/**', 'public/**', 'packages/**', 'proxy.ts', 'instrumentation.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v1-${{ hashFiles('yarn.lock') }}-
      - name: Build
        run: yarn build

  # The full Vitest suite accumulates V8 heap across its ~690 test files, so a
  # single-process run intermittently crashed a worker fork with "JavaScript
  # heap out of memory" (all tests still passed). Raising the heap ceiling only
  # delayed it (GC grew lazier and the live set climbed to ~8 GB before
  # thrashing), and two sequential shards were still borderline (~345 files each
  # occasionally OOM'd). Split the suite into four shards that each run on their
  # own runner: every shard imports and runs only ~1/4 of the files, so peak
  # memory per fork stays well under the ceiling, and the shards run in parallel
  # for fast wall-clock. NODE_OPTIONS gives the fork workers extra headroom.
  # NOTE: a large share of that "heap OOM" was really a Radix FocusScope <-> jsdom
  # synchronous-focus recursion piling up thrown errors until the worker died
  # (fixed by the focus-depth guard in test/setup/vitest.setup.ts). The sharding + heap
  # headroom are kept as defence in depth and for wall-clock parallelism.
  # Test files now run on worker threads (vitest.config.ts `projects`), with a
  # fresh thread per file; only the few files that call process.chdir() or
  # import the withTimeZone helper still run in forked processes.
  test-shards:
    name: Test Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      # Run every shard even if one fails, so all failures surface in one run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run test shard
        run: yarn test --shard=${{ matrix.shard }}/4
        env:
          TEST_DATABASE_TYPE: sqlite
          NODE_OPTIONS: --max-old-space-size=8192
          # Deliberately NOT UTC. vitest.config.ts pins the suite to UTC itself;
          # a non-UTC runner zone is what lets test/vitest.config.test.ts fail here
          # if that pin is deleted, moved back to `test.env`, or weakened to a
          # default (`??=`). On a UTC runner (the default) it could not fail.
          TZ: Pacific/Noumea

  # Aggregate gate that keeps the required "All Tests" status check name stable
  # while the work fans out across the shard matrix above. `if: always()` plus
  # the explicit result check is required: without it a failed/skipped shard
  # would leave this job skipped, and GitHub counts a skipped required check as
  # passing.
  test:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [test-shards]
    if: ${{ always() }}
    steps:
      - name: Verify all test shards succeeded
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: |
          echo "Test shards result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more test shards did not succeed (got: $RESULT)"
            exit 1
          fi
          echo "All test shards succeeded."

  # Bounded PostgreSQL integration test job covering database access layers:
  # media (and media details/gallery, incl. gallery services), fitness files, gear, component periods, heatmap tiles, queue jobs,
  # status deletion queue transactions, list membership row locking, likes,
  # accounts (sessions and provider links), the small Kysely-ported domains
  # (account notes, domain blocks, custom emojis, endorsements, followed tags,
  # idempotency keys, import locks, instance rules, markers, relays, server
  # settings, the translation cache, keyset pagination), actor deletion, the
  # job, OAuth, push and scheduled-status domains (dead letter jobs, queue job
  # claim and replay, OAuth clients and connected apps, push subscriptions,
  # scheduled statuses), the filter, report, mute and suggestion domains
  # (filters, server filters, reports, conversation mutes, detected languages,
  # friends-of-friends suggestions), the block, actor mute, bookmark, status
  # quote, status reaction and link preview domains (blocks and their counters,
  # actor mutes, bookmarks, quote edges, emoji reactions, link preview cards),
  # the announcement, notification and instance activity domains
  # (announcements with their reads and reactions, notifications and their
  # requests queue, weekly activity and login buckets), the search, featured
  # tag and trends domains (the full-text index, account search by profile
  # text, exact handle and followed accounts, hashtag aggregates, status search
  # and which indexed statuses a viewer can find, featured tags with their
  # stats, trending tags and statuses), the admin domain (account and hashtag
  # listings, service statistics, domain block and allow rules with their
  # import), the fitness settings, Wahoo import and Strava archive import
  # domains (per-actor provider settings with their encrypted tokens and OAuth
  # state, Wahoo workout and history imports and their calendar days kept
  # whatever the process time zone, Strava archive imports), the account and
  # moderation domains (account and actor creation with their counters and
  # search documents, sessions and the OAuth token detach, e-mail change and
  # password reset, actor and account moderation state, the admin account
  # listing), the direct conversation domain (conversation listings and their
  # cursors, read and hidden state, syncing statuses into conversations with
  # their participants and blocks, the read-marker row lock, the legacy
  # conversation backfill), the actor domain (actor rows with their search
  # documents, profile settings and the accepted-senders row lock, counters
  # and NodeInfo statistics, the Mastodon account view and the profile
  # directory, the federation signing actor, publicId and case-insensitive
  # username lookups, deletion scheduling), the follow and list domains with
  # the local actor predicate (follow edges and requests with their counters
  # and cursors, remote actors stored with an empty key kept out of the local
  # timelines, followers collections and fan-out, lists and their members, the
  # materialized list timeline with its backfill and fan-out), the collection
  # and timeline domains (collections with their members, items and listings,
  # the owner and public collection feeds with their cap, trim, backfill and
  # fan-out, the collection member ingest job, the home, direct, local public
  # and federated timelines with their cursors, the local public count and its
  # query shape, the timeline fan-out service), the fitness gear
  # domain (bikes, shoes and recording devices, their components and install
  # periods, default-sport auto-assign, distance, device and component rollups,
  # service reminders, the gear a processed file is given and the gear and
  # device names a status returns), the media reads (a status's attachments, an
  # actor's attachments behind the Kysely actor-visible status filter checked
  # against its Knex original, the account's media listing with its counter
  # total and paging, media by id and the statuses its owner's account
  # attached it to, storage usage) with the media routes and the upload and
  # attach services over them, the media writes (uploads and their
  # verification with the account usage counters and hour buckets, attachment
  # inserts, playback and remote-attachment swaps, media edits, the media
  # deletes with their edit files and album items and covers behind the
  # gallery album lock the album writes share, the subject and place
  # lookups and subject suggestions) with the lookup, suggestion, quota and
  # map-attachment code over them, and the other suites that read or write
  # media on a real database (the media describe, album, photo-edit, photo-edit
  # enhance and photo-edit revert routes, status edits with media, the photo
  # editor domain, status writes and deletes that hydrate attachments, the
  # profile page data), the status lookups, poll reads, hashtag reads and pins
  # (statuses by url, url hash, publicId and path segment, an actor's own
  # boost, poll votes, the hashtag timeline, admin page and counter, pins with
  # their per-actor cap and row lock, the favourited-by and reblogged-by pages
  # behind the Kysely set form of the publicly-readable predicate) with the
  # status action (pin included), status create and batch read, favourited-by,
  # reblogged-by, unreblog, poll edit, account status, user status, bookmark,
  # collection feed and status filter routes, the announce, note emoji and
  # poll actions, the create-note, create-poll and update-note jobs and the
  # Mastodon status, filter, context, mention, notification and client id
  # services over them, the status writes (note, poll and boost creates with
  # their recipients, status, reblog and reply counters, hour buckets and
  # lastStatusAt, a duplicate delivery recovered after its failed transaction,
  # the note and poll edits with their revisions, attachments and tallies, the
  # audience change that moves the public counts, the quote policy, tags and
  # hashtag counters, poll votes) with the status edit, interaction policy,
  # quote and scheduled status routes, the shared inbox, the create-note,
  # update-note and visibility actions, the remote fetch, the announce, note,
  # relay announce, forwarded activity, poll vote, update-note, update-poll,
  # remote status fetch, follow backfill and scheduled status jobs and the
  # edited-media refresh service over them, and the suites whose tests write
  # their statuses through them (the home and album pages, the timeline,
  # notification, trend, favourite, featured tag, quote, quote authorization,
  # status, context, history, source, account media, gallery and admin report
  # routes, the delete, like and unannounce actions, the actor posts reader,
  # the send-note, send-announce, quote request, quote revoke and delete-object
  # jobs, the favourites page, forwarding, status edits, quote notification,
  # reaction, timeline and trending status services, the status type and the
  # status text processing), the fitness file domain (uploads with their
  # storage and file counters and hourly buckets, deletes, processing and
  # import status, primary assignment, the actor listing with its cursor and
  # Knex paging, the account listing with its counter total, the overview
  # summary, calendar, window and earliest activity, whether an actor has
  # fitness data for a viewer) with the fitness routes, the import, processing,
  # map regeneration and heatmap jobs, the actor archive export and the
  # services over it, the gallery domain (gear with its limit and device keys,
  # gallery settings, the gallery media, index, map and gear-usage reads with
  # their cursors, unposted media and adding it to the gallery, the lookup
  # cache and its prune, the album suggestions' item read, the albums and their
  # per-actor and per-album caps behind the actor row lock, the SQLite query
  # plans of the gallery statements) with the account gallery, gallery gear,
  # media and settings routes, the gallery album routes and the album page, the
  # v2 media upload, note creation and the gallery lookup backfill (with its
  # real place lookup) over it, the cached activity routes and route heatmap
  # domain (route upserts with their bounding box, chunked route reads, the
  # region count and bounds over countable activities, heatmaps by id, key and
  # share token, the pyramid subscribers and their progress mirror, the
  # per-actor listings and their filters, status updates with the clear-deleted
  # cutoff, share tokens, cancels, soft deletes, region names), the Kysely
  # countable-activity predicate checked against its rule written out in
  # JavaScript, the gallery media scope checked on the album reads' join, the
  # Kysely status visibility, actor-visible status, list eligibility, replies
  # policy, block/mute, follow-target, exclusive-list and publicly-readable
  # predicates checked against their Knex originals, and the Knex-backed Kysely
  # driver (result normalisation, the mixed-transaction guard, counters, bucket
  # counters, chunked IN lists, savepoints).
  # Vitest worker concurrency is bounded (--maxWorkers=2) to avoid exhausting
  # database connections or overloading disposable service containers.
  test-pg:
    name: PostgreSQL Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Wait for PostgreSQL readiness
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready -U activities -d postgres -q; do
            sleep 1
          done
      - name: Run PostgreSQL database integration tests
        run: |
          yarn test --maxWorkers=2 \
            lib/database/sql/media.test.ts \
