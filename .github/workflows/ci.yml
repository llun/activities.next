name: CI

# Runs on every commit (push to any branch + pull requests). The lint/prettier,
# typecheck, build, SQLite test shards, PostgreSQL test shards, and docker
# smoke jobs run in parallel (no `needs:` chain between them) so the check
# finishes as fast as the slowest single job instead of the sum of all of
# them. The `All Tests` job (id `test`) fans in the SQLite test shards and the
# PostgreSQL test shards and fails closed. Branch protection requires
# `All Tests`, `Lint and Prettier` and `Build`. `CI Success` aggregates every
# job and fails unless all of them succeeded (skipped or cancelled count as
# failure). `cancel-in-progress` (below) also kills superseded runs so a new
# push fails fast past the old one.
#
# Everything runs in the normal push/pull_request context: jobs use the default
# read-only token, pull_request runs check out the PR merge ref (catching
# post-merge integration failures), and fork PRs are handled natively without a
# privileged workflow_run job executing untrusted code.

on:
  push:
  pull_request:

# Least privilege: every job only needs to read the repo to check it out. No job
# writes statuses, contents, or packages.
permissions:
  contents: read

# Cancel superseded runs for the same ref so rapid pushes don't pile up the full
# lint -> build -> test chain.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: Lint and Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Check prettier formatting
        run: yarn prettier:check

  # `next build` type-checks tsconfig.build.json, which excludes *.test.ts(x).
  # This job runs the same compiler over tsconfig.json (all files including
  # tests and scripts) via `yarn typecheck`.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type check
        run: yarn typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-v1-${{ hashFiles('yarn.lock') }}-${{ hashFiles('next.config.ts', 'tsconfig*.json', 'postcss.config.mjs', 'package.json', '.yarnrc.yml') }}-${{ hashFiles('app/**', 'lib/**', 'public/**', 'packages/**', 'proxy.ts', 'instrumentation.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-v1-${{ hashFiles('yarn.lock') }}-
      - name: Build
        run: yarn build
      - name: Check route JS budgets
        run: yarn bundle:report --check

  # The full Vitest suite accumulates V8 heap across its ~690 test files, so a
  # single-process run intermittently crashed a worker fork with "JavaScript
  # heap out of memory" (all tests still passed). Raising the heap ceiling only
  # delayed it (GC grew lazier and the live set climbed to ~8 GB before
  # thrashing), and two sequential shards were still borderline (~345 files each
  # occasionally OOM'd). Split the suite into four shards that each run on their
  # own runner: every shard imports and runs only ~1/4 of the files, so peak
  # memory per fork stays well under the ceiling, and the shards run in parallel
  # for fast wall-clock. NODE_OPTIONS gives the fork workers extra headroom.
  # NOTE: a large share of that "heap OOM" was really a Radix FocusScope <-> jsdom
  # synchronous-focus recursion piling up thrown errors until the worker died
  # (fixed by the focus-depth guard in test/setup/vitest.setup.ts). The sharding + heap
  # headroom are kept as defence in depth and for wall-clock parallelism.
  # Test files now run on worker threads (vitest.config.ts `projects`), with a
  # fresh thread per file; only the few files that call process.chdir() or
  # import the withTimeZone helper still run in forked processes.
  test-shards:
    name: Test Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      # Run every shard even if one fails, so all failures surface in one run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run test shard
        run: yarn test --shard=${{ matrix.shard }}/4
        env:
          TEST_DATABASE_TYPE: sqlite
          NODE_OPTIONS: --max-old-space-size=8192
          # Deliberately NOT UTC. vitest.config.ts pins the suite to UTC itself;
          # a non-UTC runner zone is what lets test/vitest.config.test.ts fail here
          # if that pin is deleted, moved back to `test.env`, or weakened to a
          # default (`??=`). On a UTC runner (the default) it could not fail.
          TZ: Pacific/Noumea

  # PostgreSQL database tests over every test file whose import graph reaches a
  # PostgreSQL-capable test helper. The list is generated at run time by
  # scripts/maintenance/listPostgresTestFiles.ts (414 files at the time of
  # writing) and split into two shards for wall-clock parallelism. Env vars
  # honour TEST_DATABASE_TYPE so the helpers pick the pg backend, pointed at
  # the `postgres` service.
  #
  # Shard 1 also runs the schema drift checks, so they run exactly once per
  # CI run: fresh SQLite and PostgreSQL databases are migrated, the reference
  # dumps (migrations/schema.sqlite.sql, migrations/schema.sql) are
  # regenerated and diffed, the Kysely DB types (lib/database/kysely/db.ts)
  # are regenerated from the migrated PostgreSQL database and diffed, and the
  # baseline is loaded on PostgreSQL 14 (the oldest version the docs support)
  # and dumped the same way. There is no hand-written PostgreSQL test file
  # list anywhere: a new database-reaching test file is picked up
  # automatically.
  test-pg:
    name: PostgreSQL Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # Run every shard even if one fails, so all failures surface in one run.
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U activities"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Only used by the PostgreSQL 14 baseline migration-and-dump check in
      # shard 1; the PostgreSQL 17 checks run against the `postgres` service.
      postgres14:
        image: postgres:14
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: activities
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U activities"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run PostgreSQL database tests (shard ${{ matrix.shard }}/2)
        env:
          TEST_DATABASE_TYPE: pg
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DATABASE_USERNAME: activities
          TEST_DATABASE_PASSWORD: activities
        run: |
          node scripts/run.cjs scripts/maintenance/listPostgresTestFiles.ts \
            > /tmp/pg-test-files.txt
          count=$(wc -l < /tmp/pg-test-files.txt)
          echo "Running $count PostgreSQL test files in shard ${{ matrix.shard }}/2"
          if [ "$count" -eq 0 ]; then
            echo "::error::The generated PostgreSQL test file list is empty; refusing to run the whole suite unfiltered."
            exit 1
          fi
          xargs -a /tmp/pg-test-files.txt -d '\n' \
            yarn test --shard=${{ matrix.shard }}/2 --maxWorkers=2
      # --- Schema drift checks (shard 1 only) -----------------------------
      # The Vitest suite builds every test database from
      # migrations/schema.sqlite.sql (via lib/database/testing/schema.ts)
      # instead of running the migrations, so a dump that lags the migrations
      # makes the whole suite test a stale schema. Run `yarn migrate` against
      # a fresh SQLite database, apply the documented dump-and-strip pipeline,
      # and fail if the result differs from the committed file.
      - name: Run migrations against a fresh SQLite database
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          ACTIVITIES_DATABASE_CLIENT=better-sqlite3 \
          ACTIVITIES_DATABASE_SQLITE_FILENAME=/tmp/schema-check.sqlite3 \
            yarn migrate
      - name: Verify every migration file ran (SQLite)
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          applied=$(sqlite3 /tmp/schema-check.sqlite3 'SELECT count(*) FROM kysely_migration;')
          files=$(ls migrations/[0-9]*_*.ts | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::kysely_migration has $applied rows but migrations/ has $files migration files"
            exit 1
          fi
      - name: Diff regenerated SQLite dump against migrations/schema.sqlite.sql
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          sqlite3 /tmp/schema-check.sqlite3 '.schema' \
            | grep -vE "^CREATE TABLE sqlite_sequence" \
            | grep -vE "^CREATE TABLE IF NOT EXISTS '[A-Za-z_]+_fts_(data|idx|docsize|config|content)'" \
            > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sqlite.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sqlite.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi
      # PostgreSQL 17 drift checks against a fresh `activities` database on the
      # `postgres` service, then the same schema loaded on PostgreSQL 14 and
      # dumped with the same normalization.
      - name: Create the schema-check database
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U activities -d postgres \
            -c 'DROP DATABASE IF EXISTS activities' \
            -c 'CREATE DATABASE activities'
      - name: Run migrations against a fresh PostgreSQL database
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            yarn migrate
      - name: Verify every migration file ran (PostgreSQL)
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          applied=$(docker exec ${{ job.services.postgres.id }} psql -U activities -d activities -tAc 'SELECT count(*) FROM kysely_migration;')
          files=$(ls migrations/[0-9]*_*.ts | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::kysely_migration has $applied rows but migrations/ has $files migration files"
            exit 1
          fi
      - name: Diff regenerated dump against migrations/schema.sql
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U activities -d activities --schema-only --no-owner --no-privileges \
            > /tmp/schema_raw.sql
          awk '
            /^SET statement_timeout/ { started = 1 }
            !started { next }
            /^--/ { next }
            /^\\(un)?restrict/ { next }
            /^SET default_tablespace/ { next }
            /^SET default_table_access_method/ { next }
            { print }
          ' /tmp/schema_raw.sql | cat -s > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi
      # The Kysely DB types (lib/database/kysely/db.ts) are generated from this
      # migrated database plus migrations/schema.sqlite.sql, so they drift
      # whenever a migration changes the schema.
      - name: Diff regenerated Kysely DB types against lib/database/kysely/db.ts
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            node scripts/run.cjs scripts/maintenance/generateDatabaseTypes.ts \
              --output /tmp/db-regenerated.ts
          if ! diff -u lib/database/kysely/db.ts /tmp/db-regenerated.ts; then
            echo "::error::lib/database/kysely/db.ts is out of sync with the schema. Regenerate it in this PR — see docs/setup.md → 'Regenerating the Kysely DB types'."
            exit 1
          fi
      # The baseline (migrations/baseline/postgres.sql) has no PostgreSQL 17-only
      # settings, so a fresh install on PostgreSQL 14 gets the same schema. The
      # dump is taken with the PostgreSQL 17 pg_dump, as above; only its
      # `SET transaction_timeout` preamble line is left out of the comparison.
      - name: Load the baseline on PostgreSQL 14 and diff its dump
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres14.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            yarn migrate
          docker run --rm --network host -e PGPASSWORD=activities postgres:17 \
            pg_dump -h 127.0.0.1 -p ${{ job.services.postgres14.ports['5432'] }} \
              -U activities -d activities --schema-only --no-owner --no-privileges \
            > /tmp/schema14_raw.sql
          awk '
            /^SET statement_timeout/ { started = 1 }
            !started { next }
            /^--/ { next }
            /^\\(un)?restrict/ { next }
            /^SET default_tablespace/ { next }
            /^SET default_table_access_method/ { next }
            /^SET transaction_timeout/ { next }
            { print }
          ' /tmp/schema14_raw.sql | cat -s > /tmp/schema14.sql
          if ! grep -v '^SET transaction_timeout' migrations/schema.sql | diff -u - /tmp/schema14.sql; then
            echo "::error::The baseline does not load on PostgreSQL 14 as the schema in migrations/schema.sql."
            exit 1
          fi

  # Aggregate gate for the test jobs: this is the job to mark required in
  # branch protection as "All Tests". It always runs (`if: always()`) and
  # fails closed unless every test shard and the PostgreSQL shard succeeded.
  test:
    name: All Tests
    needs: [test-shards, test-pg]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all test shards succeeded
        env:
          RESULTS: ${{ needs.test-shards.result }} ${{ needs.test-pg.result }}
        run: |
          echo "Test shard results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (got: $result)"
              exit 1
            fi
          done
          echo "All test shards succeeded."

  # Build and verify the minimal Docker image: it starts with SQLite, serves
  # /api/v2/instance, exercises Sharp, and omits the optional SDKs. Does not
  # publish images to any registry.
  docker-smoke-minimal:
    name: Docker Images Smoke Test (minimal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build minimal Docker image
        run: docker build -t activities:test-minimal .
      - name: Verify minimal Docker image
        run: |
          node scripts/run.cjs scripts/maintenance/verifyDockerImages.ts \
            --skip-build \
            --only minimal \
            --minimal-image activities:test-minimal

  # Build and verify the full Docker image: it loads the optional queue SDKs and
  # executes queries against a local PostgreSQL database without contacting cloud
  # services. Does not publish images to any registry.
  docker-smoke-full:
    name: Docker Images Smoke Test (full)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build full Docker image with optional workspaces
        run: |
          docker build -t activities:test-full \
            --build-arg WORKSPACES="activities.next @activities/nodemailer @activities/resend @activities/ses @activities/pg @activities/cloudtasks @activities/qstash" \
            .
      - name: Verify full Docker image
        run: |
          node scripts/run.cjs scripts/maintenance/verifyDockerImages.ts \
            --skip-build \
            --only full \
            --full-image activities:test-full

  # Aggregate gate: this is the single check to mark required in branch
  # protection. It always runs (`if: always()`) and fails unless every upstream
  # job succeeded, so a failure in any one of the parallel jobs fails the overall
  # required check. It also covers the case where an upstream job is skipped or
  # cancelled — GitHub treats a skipped required check as passing, so requiring
  # the individual jobs directly would not reliably block a failure.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        lint-prettier,
        typecheck,
        build,
        test-shards,
        test-pg,
        test,
        docker-smoke-minimal,
        docker-smoke-full
      ]
    if: ${{ always() }}
    steps:
      - name: Verify all CI jobs succeeded
        env:
          RESULTS: ${{ needs.lint-prettier.result }} ${{ needs.typecheck.result }} ${{ needs.build.result }} ${{ needs.test-shards.result }} ${{ needs.test-pg.result }} ${{ needs.test.result }} ${{ needs.docker-smoke-minimal.result }} ${{ needs.docker-smoke-full.result }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (got: $result)"
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
