name: CI

# Runs on every commit (push to any branch + pull requests). The lint/prettier,
# typecheck, build, test, postgresql database test, schema-dump-sync, and docker-smoke jobs run in parallel (no `needs:` chain
# between them) so the check finishes as fast as the slowest single job instead
# of the sum of all of them. If any one of them fails, the run is reported as failed: the
# `CI / CI Success` job aggregates every job's result and fails unless all
# succeeded. Mark that job as the required status check in branch protection — it
# avoids the skipped-job-counts-as-passing gap that requiring the individual jobs
# would have. `cancel-in-progress` (below) also kills superseded runs so a new
# push fails fast past the old one.
#
# Everything runs in the normal push/pull_request context: jobs use the default
# read-only token, pull_request runs check out the PR merge ref (catching
# post-merge integration failures), and fork PRs are handled natively without a
# privileged workflow_run job executing untrusted code.

on:
  push:
  pull_request:

# Least privilege: every job only needs to read the repo to check it out. No job
# writes statuses, contents, or packages.
permissions:
  contents: read

# Cancel superseded runs for the same ref so rapid pushes don't pile up the full
# lint -> build -> test chain.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-prettier:
    name: Lint and Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Check prettier formatting
        run: yarn prettier:check

  # `next build` type-checks tsconfig.build.json, which excludes *.test.ts(x).
  # This job runs the same compiler over tsconfig.json (all files including
  # tests and scripts) via `yarn typecheck`.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type check
        run: yarn typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build

  # The full Vitest suite accumulates V8 heap across its ~690 test files, so a
  # single-process run intermittently crashed a worker fork with "JavaScript
  # heap out of memory" (all tests still passed). Raising the heap ceiling only
  # delayed it (GC grew lazier and the live set climbed to ~8 GB before
  # thrashing), and two sequential shards were still borderline (~345 files each
  # occasionally OOM'd). Split the suite into four shards that each run on their
  # own runner: every shard imports and runs only ~1/4 of the files, so peak
  # memory per fork stays well under the ceiling, and the shards run in parallel
  # for fast wall-clock. NODE_OPTIONS gives the fork workers extra headroom.
  # NOTE: a large share of that "heap OOM" was really a Radix FocusScope <-> jsdom
  # synchronous-focus recursion piling up thrown errors until the worker died
  # (fixed by the focus-depth guard in test/setup/vitest.setup.ts). The sharding + heap
  # headroom are kept as defence in depth and for wall-clock parallelism.
  # Test files now run on worker threads (vitest.config.ts `projects`), with a
  # fresh thread per file; only the few files that call process.chdir() or
  # import the withTimeZone helper still run in forked processes.
  test-shards:
    name: Test Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      # Run every shard even if one fails, so all failures surface in one run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run test shard
        run: yarn test --shard=${{ matrix.shard }}/4
        env:
          TEST_DATABASE_TYPE: sqlite
          NODE_OPTIONS: --max-old-space-size=8192
          # Deliberately NOT UTC. vitest.config.ts pins the suite to UTC itself;
          # a non-UTC runner zone is what lets test/vitest.config.test.ts fail here
          # if that pin is deleted, moved back to `test.env`, or weakened to a
          # default (`??=`). On a UTC runner (the default) it could not fail.
          TZ: Pacific/Noumea

  # Aggregate gate that keeps the required "All Tests" status check name stable
  # while the work fans out across the shard matrix above. `if: always()` plus
  # the explicit result check is required: without it a failed/skipped shard
  # would leave this job skipped, and GitHub counts a skipped required check as
  # passing.
  test:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [test-shards]
    if: ${{ always() }}
    steps:
      - name: Verify all test shards succeeded
        env:
          RESULT: ${{ needs.test-shards.result }}
        run: |
          echo "Test shards result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more test shards did not succeed (got: $RESULT)"
            exit 1
          fi
          echo "All test shards succeeded."

  # Bounded PostgreSQL integration test job covering database access layers:
  # media (and media details/gallery, incl. gallery services), fitness files, gear, component periods, heatmap tiles, queue jobs,
  # status deletion queue transactions, list membership row locking, likes,
  # accounts (sessions and provider links), the small Kysely-ported domains
  # (account notes, domain blocks, custom emojis, endorsements, followed tags,
  # idempotency keys, import locks, instance rules, markers, relays, server
  # settings, the translation cache, keyset pagination), actor deletion, the
  # job, OAuth, push and scheduled-status domains (dead letter jobs, queue job
  # claim and replay, OAuth clients and connected apps, push subscriptions,
  # scheduled statuses), the filter, report, mute and suggestion domains
  # (filters, server filters, reports, conversation mutes, detected languages,
  # friends-of-friends suggestions), the block, actor mute, bookmark, status
  # quote, status reaction and link preview domains (blocks and their counters,
  # actor mutes, bookmarks, quote edges, emoji reactions, link preview cards),
  # the announcement, notification and instance activity domains
  # (announcements with their reads and reactions, notifications and their
  # requests queue, weekly activity and login buckets), the search, featured
  # tag and trends domains (the full-text index, account search by profile
  # text, exact handle and followed accounts, hashtag aggregates, status search
  # and which indexed statuses a viewer can find, featured tags with their
  # stats, trending tags and statuses), the admin domain (account and hashtag
  # listings, service statistics, domain block and allow rules with their
  # import), the account and moderation domains (account and actor creation
  # with their counters and search documents, sessions and the OAuth token
  # detach, e-mail change and password reset, actor and account moderation
  # state, the admin account listing), the direct conversation domain
  # (conversation listings and their cursors, read and hidden state, syncing
  # statuses into conversations with their participants and blocks, the
  # read-marker row lock, the legacy conversation backfill), the Kysely status
  # visibility filter checked against its Knex original, and the Knex-backed
  # Kysely driver (result normalisation, the mixed-transaction guard,
  # counters, bucket counters, chunked IN lists, savepoints).
  # Vitest worker concurrency is bounded (--maxWorkers=2) to avoid exhausting
  # database connections or overloading disposable service containers.
  test-pg:
    name: PostgreSQL Database Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Wait for PostgreSQL readiness
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready -U activities -d postgres -q; do
            sleep 1
          done
      - name: Run PostgreSQL database integration tests
        run: |
          yarn test --maxWorkers=2 \
            lib/database/sql/media.test.ts \
            lib/database/sql/mediaAccountListing.test.ts \
            lib/database/sql/mediaMutations.test.ts \
            lib/database/sql/mediaDetails.test.ts \
            lib/database/sql/gallery.test.ts \
            lib/database/sql/galleryMedia.test.ts \
            lib/database/sql/galleryAlbums.test.ts \
            lib/database/sql/galleryAlbumsVisibility.test.ts \
            lib/database/sql/galleryAlbumSuggestions.test.ts \
            lib/services/gallery/galleryAlbumQueries.test.ts \
            lib/services/gallery/galleryAlbumVisitor.test.ts \
            lib/services/gallery/galleryAlbumSuggestions.test.ts \
            lib/services/gallery/galleryQueries.test.ts \
            lib/services/gallery/galleryGear.test.ts \
            lib/services/gallery/subjectHashtags.test.ts \
            lib/services/gallery/uploadMediaDetails.test.ts \
            lib/database/sql/galleryLookupCache.test.ts \
            lib/database/sql/fitnessFile.test.ts \
            lib/database/sql/fitnessFileActivityStats.test.ts \
            lib/database/sql/fitnessFileOverviewWindows.test.ts \
            lib/database/sql/fitnessGear.test.ts \
            lib/database/sql/fitnessGearComponents.test.ts \
            lib/database/sql/fitnessGearDevice.test.ts \
            lib/database/sql/fitnessGearComponentPeriods.test.ts \
            lib/database/sql/fitnessRouteHeatmapTile.test.ts \
            lib/database/sql/fitnessRouteHeatmapTileClaim.test.ts \
            lib/database/sql/fitnessRouteHeatmapTileClaimRace.test.ts \
            lib/database/sql/queueJob.test.ts \
            lib/database/sql/statusDeletionQueue.test.ts \
            lib/database/sql/stravaArchiveImport.test.ts \
            lib/database/sql/list.test.ts \
            lib/database/sql/listMembershipEligibility.test.ts \
            lib/database/sql/like.test.ts \
            lib/database/sql/account.test.ts \
            lib/database/sql/accountNote.test.ts \
            lib/database/sql/actorDomainBlock.test.ts \
            lib/database/sql/customEmoji.test.ts \
            lib/database/sql/endorsement.test.ts \
            lib/database/sql/followedTag.test.ts \
            lib/database/sql/idempotency.test.ts \
            lib/database/sql/importLock.test.ts \
            lib/database/sql/instanceRule.test.ts \
            lib/database/sql/marker.test.ts \
            lib/database/sql/relay.test.ts \
            lib/database/sql/serverSetting.test.ts \
            lib/database/sql/actorDeletion.test.ts \
            lib/database/sql/deadLetterJobs.test.ts \
            lib/database/sql/oauth.test.ts \
            lib/database/sql/pushSubscription.test.ts \
            lib/database/sql/scheduledStatus.test.ts \
            lib/database/sql/filter.test.ts \
            lib/database/sql/serverFilter.test.ts \
            lib/database/sql/report.test.ts \
            lib/database/sql/statusDetectedLanguage.test.ts \
            lib/database/sql/statusMute.test.ts \
            lib/database/sql/suggestion.test.ts \
            lib/services/notifications/createConversationMuteSuppression.test.ts \
            lib/database/sql/block.test.ts \
            lib/database/sql/mute.test.ts \
            lib/database/sql/bookmark.test.ts \
            lib/database/sql/statusQuote.test.ts \
            lib/database/sql/statusReaction.test.ts \
            lib/database/sql/linkPreview.test.ts \
            lib/database/sql/announcement.test.ts \
            lib/database/sql/notification.test.ts \
            lib/database/sql/instanceActivityDatabase.test.ts \
            lib/database/sql/searchAccounts.test.ts \
            lib/database/sql/searchAccountQueries.test.ts \
            lib/database/sql/searchDocuments.test.ts \
            lib/database/sql/searchDocumentFilter.test.ts \
            lib/database/sql/searchHashtags.test.ts \
            lib/database/sql/searchHashtagQueries.test.ts \
            lib/database/sql/searchStatuses.test.ts \
            lib/database/sql/searchStatusQueries.test.ts \
            lib/database/sql/featuredTag.test.ts \
            lib/database/sql/featuredTagQueries.test.ts \
            lib/database/sql/trends.test.ts \
            lib/database/sql/trendsQueries.test.ts \
            lib/database/kysely/visibility/visibilityEquivalence.test.ts \
            lib/database/sql/admin.test.ts \
            lib/database/sql/adminDomainRules.test.ts \
            lib/database/sql/accountQueries.test.ts \
            lib/database/sql/sessionTokenDetach.test.ts \
            lib/database/sql/moderation.test.ts \
            lib/database/sql/moderationQueries.test.ts \
            lib/database/sql/conversation.test.ts \
            lib/database/sql/conversationQueries.test.ts \
            lib/database/sql/directConversationsMigration.test.ts \
            lib/database/kysely/driver.test.ts \
            lib/database/kysely/guard.test.ts \
            lib/database/kysely/counter.test.ts \
            lib/database/kysely/counterBucket.test.ts \
            lib/database/kysely/keyset.test.ts \
            lib/database/kysely/inList.test.ts \
            lib/database/kysely/savepoint.test.ts \
            lib/services/translation/translationCache.integration.test.ts \
            lib/database/testing/createTestDatabase.test.ts \
            lib/database/testing/fixtures.test.ts
        env:
          TEST_DATABASE_TYPE: pg
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DATABASE_USERNAME: activities
          TEST_DATABASE_PASSWORD: activities

  # Drift gate for the committed SQLite reference schema dump. The Vitest
  # suite builds every test database from migrations/schema.sqlite.sql (via
  # lib/database/testing/schema.ts) instead of running the Knex migration chain, so
  # a dump that lags the migrations makes the whole suite test a stale schema.
  # This job replays all migrations against a fresh SQLite database, applies
  # the documented dump-and-strip pipeline (CONTRIBUTING.md → "SQLite —
  # migrations/schema.sqlite.sql"), and fails if the result differs from the
  # committed file.
  schema-dump-check:
    name: SQLite Schema Dump Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run migrations against a fresh SQLite database
        run: |
          ACTIVITIES_DATABASE_CLIENT=better-sqlite3 \
          ACTIVITIES_DATABASE_SQLITE_FILENAME=/tmp/schema-check.sqlite3 \
            yarn migrate
      - name: Verify every migration file ran
        run: |
          applied=$(sqlite3 /tmp/schema-check.sqlite3 'SELECT count(*) FROM knex_migrations;')
          files=$(ls migrations/*.js | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::knex_migrations has $applied rows but migrations/ has $files files"
            exit 1
          fi
      - name: Diff regenerated dump against migrations/schema.sqlite.sql
        run: |
          sqlite3 /tmp/schema-check.sqlite3 '.schema' \
            | grep -vE "^CREATE TABLE sqlite_sequence" \
            | grep -vE "^CREATE TABLE IF NOT EXISTS '[A-Za-z_]+_fts_(data|idx|docsize|config|content)'" \
            > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sqlite.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sqlite.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi

  # Drift gate for the committed PostgreSQL reference schema dump. This job
  # starts a PostgreSQL 17 service container, waits for readiness, replays all
  # migrations against a fresh database, verifies that every migration file ran,
  # generates a schema-only dump using PostgreSQL 17 tooling, applies the
  # documented normalization (CONTRIBUTING.md → "PostgreSQL —
  # migrations/schema.sql"), and fails if the result differs from the committed file.
  # It then regenerates the Kysely DB types (lib/database/kysely/db.ts) from the
  # same database and fails if they differ from the committed file too.
  schema-dump-check-pg:
    name: PostgreSQL Schema Dump Sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: activities
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Wait for PostgreSQL readiness
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready -U activities -d activities -q; do
            sleep 1
          done
      - name: Run migrations against a fresh PostgreSQL database
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            yarn migrate
      - name: Verify every migration file ran
        run: |
          applied=$(docker exec ${{ job.services.postgres.id }} psql -U activities -d activities -tAc 'SELECT count(*) FROM knex_migrations;')
          files=$(ls migrations/*.js | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::knex_migrations has $applied rows but migrations/ has $files files"
            exit 1
          fi
      - name: Diff regenerated dump against migrations/schema.sql
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U activities -d activities --schema-only --no-owner --no-privileges \
            > /tmp/schema_raw.sql
          awk '
            /^SET statement_timeout/ { started = 1 }
            !started { next }
            /^--/ { next }
            /^\\(un)?restrict/ { next }
            /^SET default_tablespace/ { next }
            /^SET default_table_access_method/ { next }
            { print }
          ' /tmp/schema_raw.sql | cat -s > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi
      # The Kysely DB types (lib/database/kysely/db.ts) are generated from this
      # migrated database plus migrations/schema.sqlite.sql, so they drift
      # whenever a migration changes the schema.
      - name: Diff regenerated Kysely DB types against lib/database/kysely/db.ts
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            node scripts/run.cjs scripts/maintenance/generateDatabaseTypes.ts \
              --output /tmp/db-regenerated.ts
          if ! diff -u lib/database/kysely/db.ts /tmp/db-regenerated.ts; then
            echo "::error::lib/database/kysely/db.ts is out of sync with the schema. Regenerate it in this PR — see docs/setup.md → 'Regenerating the Kysely DB types'."
            exit 1
          fi

  # Build and verify both minimal and full Docker images. Tests that the minimal
  # image starts with SQLite, serves /api/v2/instance, exercises Sharp, and omits
  # optional SDKs. Tests that the full image loads optional queue SDKs and
  # executes queries against a local PostgreSQL database without contacting cloud
  # services. Does not publish images to any registry.
  docker-smoke:
    name: Docker Images Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build minimal Docker image
        run: docker build -t activities:test-minimal .
      - name: Build full Docker image with optional workspaces
        run: |
          docker build -t activities:test-full \
            --build-arg WORKSPACES="activities.next @activities/nodemailer @activities/resend @activities/ses @activities/pg @activities/cloudtasks @activities/qstash" \
            .
      - name: Verify minimal and full Docker images
        run: |
          node scripts/run.cjs scripts/maintenance/verifyDockerImages.ts \
            --skip-build \
            --minimal-image activities:test-minimal \
            --full-image activities:test-full

  # Aggregate gate: this is the single check to mark required in branch
  # protection. It always runs (`if: always()`) and fails unless every upstream
  # job succeeded, so a failure in any one of the parallel jobs fails the overall
  # required check. It also covers the case where an upstream job is skipped or
  # cancelled — GitHub treats a skipped required check as passing, so requiring
  # the individual jobs directly would not reliably block a failure.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        lint-prettier,
        typecheck,
        build,
        test,
        test-pg,
        schema-dump-check,
        schema-dump-check-pg,
        docker-smoke
      ]
    if: ${{ always() }}
    steps:
      - name: Verify all CI jobs succeeded
        env:
          RESULTS: ${{ needs.lint-prettier.result }} ${{ needs.typecheck.result }} ${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.test-pg.result }} ${{ needs.schema-dump-check.result }} ${{ needs.schema-dump-check-pg.result }} ${{ needs.docker-smoke.result }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (got: $result)"
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
