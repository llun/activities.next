  # Drift gate for the committed SQLite reference schema dump. The Vitest
  # suite builds every test database from migrations/schema.sqlite.sql (via
  # lib/database/testing/schema.ts) instead of running the Knex migration chain, so
  # a dump that lags the migrations makes the whole suite test a stale schema.
  # This job replays all migrations against a fresh SQLite database, applies
  # the documented dump-and-strip pipeline (CONTRIBUTING.md → "SQLite —
  # migrations/schema.sqlite.sql"), and fails if the result differs from the
  # committed file.
  schema-dump-check:
    name: SQLite Schema Dump Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run migrations against a fresh SQLite database
        run: |
          ACTIVITIES_DATABASE_CLIENT=better-sqlite3 \
          ACTIVITIES_DATABASE_SQLITE_FILENAME=/tmp/schema-check.sqlite3 \
            yarn migrate
      - name: Verify every migration file ran
        run: |
          applied=$(sqlite3 /tmp/schema-check.sqlite3 'SELECT count(*) FROM knex_migrations;')
          files=$(ls migrations/*.js | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::knex_migrations has $applied rows but migrations/ has $files files"
            exit 1
          fi
      - name: Diff regenerated dump against migrations/schema.sqlite.sql
        run: |
          sqlite3 /tmp/schema-check.sqlite3 '.schema' \
            | grep -vE "^CREATE TABLE sqlite_sequence" \
            | grep -vE "^CREATE TABLE IF NOT EXISTS '[A-Za-z_]+_fts_(data|idx|docsize|config|content)'" \
            > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sqlite.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sqlite.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi

  # Drift gate for the committed PostgreSQL reference schema dump. This job
  # starts a PostgreSQL 17 service container, waits for readiness, replays all
  # migrations against a fresh database, verifies that every migration file ran,
  # generates a schema-only dump using PostgreSQL 17 tooling, applies the
  # documented normalization (CONTRIBUTING.md → "PostgreSQL —
  # migrations/schema.sql"), and fails if the result differs from the committed file.
  # It then regenerates the Kysely DB types (lib/database/kysely/db.ts) from the
  # same database and fails if they differ from the committed file too.
  schema-dump-check-pg:
    name: PostgreSQL Schema Dump Sync
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: activities
          POSTGRES_DB: activities
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Wait for PostgreSQL readiness
        run: |
          until docker exec ${{ job.services.postgres.id }} pg_isready -U activities -d activities -q; do
            sleep 1
          done
      - name: Run migrations against a fresh PostgreSQL database
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            yarn migrate
      - name: Verify every migration file ran
        run: |
          applied=$(docker exec ${{ job.services.postgres.id }} psql -U activities -d activities -tAc 'SELECT count(*) FROM knex_migrations;')
          files=$(ls migrations/*.js | wc -l)
          echo "applied=$applied files=$files"
          if [ "$applied" -ne "$files" ]; then
            echo "::error::knex_migrations has $applied rows but migrations/ has $files files"
            exit 1
          fi
      - name: Diff regenerated dump against migrations/schema.sql
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U activities -d activities --schema-only --no-owner --no-privileges \
            > /tmp/schema_raw.sql
          awk '
            /^SET statement_timeout/ { started = 1 }
            !started { next }
            /^--/ { next }
            /^\\(un)?restrict/ { next }
            /^SET default_tablespace/ { next }
            /^SET default_table_access_method/ { next }
            { print }
          ' /tmp/schema_raw.sql | cat -s > /tmp/schema-regenerated.sql
          if ! diff -u migrations/schema.sql /tmp/schema-regenerated.sql; then
            echo "::error::migrations/schema.sql is out of sync with the migrations. Regenerate BOTH schema dumps in this PR — see AGENTS.md → 'Keeping the reference schema dumps in sync'."
            exit 1
          fi
      # The Kysely DB types (lib/database/kysely/db.ts) are generated from this
      # migrated database plus migrations/schema.sqlite.sql, so they drift
      # whenever a migration changes the schema.
      - name: Diff regenerated Kysely DB types against lib/database/kysely/db.ts
        run: |
          ACTIVITIES_DATABASE_CLIENT=pg \
          ACTIVITIES_DATABASE_PG_HOST=127.0.0.1 \
          ACTIVITIES_DATABASE_PG_PORT=${{ job.services.postgres.ports['5432'] }} \
          ACTIVITIES_DATABASE_PG_USER=activities \
          ACTIVITIES_DATABASE_PG_PASSWORD=activities \
          ACTIVITIES_DATABASE_PG_DATABASE=activities \
            node scripts/run.cjs scripts/maintenance/generateDatabaseTypes.ts \
              --output /tmp/db-regenerated.ts
          if ! diff -u lib/database/kysely/db.ts /tmp/db-regenerated.ts; then
            echo "::error::lib/database/kysely/db.ts is out of sync with the schema. Regenerate it in this PR — see docs/setup.md → 'Regenerating the Kysely DB types'."
            exit 1
          fi

  # Build and verify both minimal and full Docker images. Tests that the minimal
  # image starts with SQLite, serves /api/v2/instance, exercises Sharp, and omits
  # optional SDKs. Tests that the full image loads optional queue SDKs and
  # executes queries against a local PostgreSQL database without contacting cloud
  # services. Does not publish images to any registry.
  docker-smoke:
    name: Docker Images Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable corepack
        run: corepack enable
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build minimal Docker image
        run: docker build -t activities:test-minimal .
      - name: Build full Docker image with optional workspaces
        run: |
          docker build -t activities:test-full \
            --build-arg WORKSPACES="activities.next @activities/nodemailer @activities/resend @activities/ses @activities/pg @activities/cloudtasks @activities/qstash" \
            .
      - name: Verify minimal and full Docker images
        run: |
          node scripts/run.cjs scripts/maintenance/verifyDockerImages.ts \
            --skip-build \
            --minimal-image activities:test-minimal \
            --full-image activities:test-full

  # Aggregate gate: this is the single check to mark required in branch
  # protection. It always runs (`if: always()`) and fails unless every upstream
  # job succeeded, so a failure in any one of the parallel jobs fails the overall
  # required check. It also covers the case where an upstream job is skipped or
  # cancelled — GitHub treats a skipped required check as passing, so requiring
  # the individual jobs directly would not reliably block a failure.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        lint-prettier,
        typecheck,
        build,
        test,
        test-pg,
        schema-dump-check,
        schema-dump-check-pg,
        docker-smoke
      ]
    if: ${{ always() }}
    steps:
      - name: Verify all CI jobs succeeded
        env:
          RESULTS: ${{ needs.lint-prettier.result }} ${{ needs.typecheck.result }} ${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.test-pg.result }} ${{ needs.schema-dump-check.result }} ${{ needs.schema-dump-check-pg.result }} ${{ needs.docker-smoke.result }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed (got: $result)"
              exit 1
            fi
          done
          echo "All CI jobs succeeded."
