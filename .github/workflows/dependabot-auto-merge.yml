name: Dependabot Auto-Merge

# `pull_request_target` runs this file from the base branch with a write token,
# so it must never execute the PR's code: it checks out the base commit, reads
# both lockfiles as data with `git show`, and runs the base branch's
# `lockfile-new-packages.mjs`. A PR that adds a package name the base lockfile
# does not have is left for a human; everything else gets auto-merge.
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the base commit (never the PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch the PR head commit
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Read both lockfiles as data
        run: |
          set -euo pipefail
          git show "$BASE_SHA:yarn.lock" > "$RUNNER_TEMP/base-yarn.lock"
          git show "$HEAD_SHA:yarn.lock" > "$RUNNER_TEMP/head-yarn.lock"

      - name: Check for new package names
        id: new-packages
        run: |
          set -euo pipefail
          node .github/scripts/lockfile-new-packages.mjs \
            "$RUNNER_TEMP/base-yarn.lock" "$RUNNER_TEMP/head-yarn.lock" \
            > "$RUNNER_TEMP/new-packages.txt"
          if [ -s "$RUNNER_TEMP/new-packages.txt" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # `pull_request.user.login` stays `dependabot[bot]` when someone else
      # pushes to a Dependabot branch, so the author alone is not enough.
      - name: Verify the sender and every commit are Dependabot's
        id: trusted
        env:
          SENDER: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$SENDER" != 'dependabot[bot]' ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=the sender is $SENDER, not dependabot[bot]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          authors=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].author.login' | sort -u)
          if [ "$authors" != 'dependabot[bot]' ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=commits are authored by $(echo "$authors" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for Dependabot PRs
        if: steps.new-packages.outputs.found == 'false' && steps.trusted.outputs.ok == 'true'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Ask a human to review the new packages
        if: steps.new-packages.outputs.found == 'true' || steps.trusted.outputs.ok != 'true'
        env:
          NEW_PACKAGES: ${{ steps.new-packages.outputs.found }}
          TRUSTED: ${{ steps.trusted.outputs.ok }}
          REASON: ${{ steps.trusted.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = 'true' ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
          {
            if [ "$NEW_PACKAGES" = 'true' ]; then
              echo "This Dependabot PR adds packages the base lockfile does not have:"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/new-packages.txt"
              echo
            fi
            if [ "$TRUSTED" != 'true' ]; then
              echo "This PR is not entirely Dependabot's: $REASON."
              echo
            fi
            echo "A human must review this PR before it merges; auto-merge is off."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/comment.md"
