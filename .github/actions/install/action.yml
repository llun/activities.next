name: Install dependencies
description: >-
  `yarn install --immutable`, retried only for a transport error (a registry
  socket reset, timeout or TLS cancellation: YN0001 with a network error
  code). A lockfile that would change (YN0028), a failing build script, a
  checksum or resolver error is a code error and runs once.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set +e -uo pipefail
        log=$(mktemp)
        for attempt in 1 2 3; do
          yarn install --immutable 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            # enableScripts is false: a package whose install script is not known to be unneeded must be
            # reviewed (and given `built: true` in package.json if it truly needs it), not silently skipped.
            allowlist=.github/yarn-unneeded-build-scripts.txt
            [ -f "$allowlist" ] || { echo "::error::$allowlist is missing"; exit 1; }
            unexpected=$(perl -ne 'print "$1\n" if /YN0004:\s+\S+\s+(\@?[^\@\s]+)\@/' "$log" \
              | sort -u | grep -vxF -f "$allowlist" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::New packages want install scripts, which are disabled: $(echo $unexpected). Review them, then add each to .github/yarn-unneeded-build-scripts.txt or give it dependenciesMeta built: true."
              exit 1
            fi
            exit 0
          fi
          if grep -q 'YN0028' "$log"; then
            echo "::error::yarn.lock would change (YN0028): commit the regenerated lockfile. Not retried."
            exit "$status"
          fi
          if ! grep -q 'YN0001' "$log" || ! grep -Eq 'ECONNREFUSED|ECANCELED|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|EPIPE|socket hang up|ERR_SSL|ERR_TLS' "$log"; then
            echo "::error::yarn install failed with a non-transport error. Not retried."
            exit "$status"
          fi
          [ "$attempt" -eq 3 ] && exit "$status"
          echo "::warning::yarn install hit a transport error (attempt $attempt); retrying in $((attempt * ${INSTALL_RETRY_BACKOFF_SECONDS:-15}))s"
          sleep $((attempt * ${INSTALL_RETRY_BACKOFF_SECONDS:-15}))
        done
