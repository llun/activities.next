version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Yarn's npmMinimalAgeGate rejects versions published less than a day ago,
    # so Dependabot must not propose them (its PRs would fail `yarn install`).
    cooldown:
      default-days: 2
    groups:
      # The better-auth stack pins exact cross-package peer versions: better-auth
      # and @better-auth/core require a specific @better-fetch/fetch (e.g.
      # better-auth 1.6.19 -> @better-auth/core 1.6.19 + @better-fetch/fetch 1.3.1).
      # Bumping any one of them on its own leaves the others behind and breaks the
      # auth client's type inference (authClient.signIn.passkey disappears, failing
      # `next build`). In #2638 Dependabot also moved @better-fetch/fetch past the
      # version better-auth pins (1.3.3 vs 1.3.2 pinned by better-auth 1.7.12),
      # leaving two copies and breaking typecheck and build. Group them so
      # dependabot upgrades the whole stack in one PR.
      # See PRs #1003 and #1011 (both broke the build via piecemeal bumps).
      better-auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
          - '@better-fetch/fetch'
          - 'better-call'
      # React 19+ requires react and react-dom to have the exact same version,
      # and type packages should match the runtime versions. Group them so
      # dependabot bumps react, react-dom, and their types together in one PR.
      # See PR #2066 (broke tests due to react 19.2.8 vs react-dom 19.3.0 mismatch).
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      # @aws-sdk/client-s3 and @aws-sdk/s3-request-presigner must share one
      # @smithy/core: bumping only client-s3 leaves two copies of @smithy/core
      # in the tree, and S3Client stops being assignable to the presigner's
      # Client type (TS2345). Group them so dependabot bumps the whole AWS
      # stack together in one PR. See PR #2639.
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
  # Yarn workspaces share the single yarn.lock at the root, so only the `/`
  # entry above may bump a workspace's dependencies. GitHub's Dependabot
  # security updates run one job per manifest the dependency graph indexes
  # and use the entry whose directory matches it; a job rooted in a workspace
  # folder finds no lockfile and opens a PR that edits package.json alone,
  # which `yarn install --immutable` refuses on every job (PR #2591, 22 red
  # jobs, 2026-10-23; its root-job twin #2592 updated the lockfile and
  # merged). `ignore: '*'` also applies to security updates, so these entries
  # make the workspace jobs open nothing; `open-pull-requests-limit: 0` turns
  # their version updates off. Add an entry when a workspace is added.
  - package-ecosystem: 'npm'
    directory: '/packages/cloudtasks'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'npm'
    directory: '/packages/nodemailer'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'npm'
    directory: '/packages/pg'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'npm'
    directory: '/packages/qstash'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'npm'
    directory: '/packages/resend'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'npm'
    directory: '/packages/ses'
    schedule: { interval: 'monthly' }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
