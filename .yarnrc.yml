# Dependency install scripts are the usual way a compromised npm release runs
# code on a developer Mac or in CI, so none run. A package that truly needs one
# gets `dependenciesMeta: { <name>: { built: true } }` in package.json.
enableScripts: false

# Resolve only versions published at least 7 days ago (in minutes), so a
# malicious release is usually caught and pulled before it can be installed.
npmMinimalAgeGate: 10080

nodeLinker: node-modules

# Registry transport retries for CI: a tarball download that resets mid-stream
# is retried by Yarn before the install step gives up.
httpRetry: 5
httpTimeout: 120000
