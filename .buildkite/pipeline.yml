# CI pipeline (Buildkite) — runs lint/prettier-check, build, and the sharded
# test suite. Deliberately simple: no GitHub status posting, no GITHUB_TOKEN
# or other secret required. Buildkite's own build page shows pass/fail for
# the whole pipeline (including the parallel test shards below) natively.
# Wiring this into GitHub's required-check / branch-protection flow is a
# separate, not-yet-done step — see AGENTS.md's CI section.
#
# Every `$$` below is intentional: `buildkite-agent pipeline upload` interpolates
# `$VAR` / `${VAR}` at upload time, and these are runtime shell variables that
# are unset then, so a bare `$VAR` would silently become an empty string before
# the shell ever runs. Do not "clean up" `$$` into `$`.

steps:
  - label: 'Lint and Prettier'
    key: 'lint-prettier'
    plugins:
      - docker#v5.14.0:
          image: 'node:24'
    command: |
      set -euo pipefail
      corepack enable
      yarn install --immutable
      yarn lint
      yarn prettier:check

  - label: 'Build'
    key: 'build'
    plugins:
      - docker#v5.14.0:
          image: 'node:24'
    command: |
      set -euo pipefail
      corepack enable
      yarn install --immutable
      yarn build

  - label: 'Test Shard'
    key: 'test-shards'
    parallelism: 4
    env:
      TEST_DATABASE_TYPE: 'sqlite'
      NODE_OPTIONS: '--max-old-space-size=8192'
    plugins:
      # The docker plugin only forwards a handful of BUILDKITE_* variables by
      # default, so the two parallelism variables have to be listed explicitly
      # alongside this step's own env.
      - docker#v5.14.0:
          image: 'node:24'
          environment:
            - TEST_DATABASE_TYPE
            - NODE_OPTIONS
            - BUILDKITE_PARALLEL_JOB
            - BUILDKITE_PARALLEL_JOB_COUNT
    command: |
      set -euo pipefail
      corepack enable
      yarn install --immutable
      yarn test --shard=$$(($${BUILDKITE_PARALLEL_JOB} + 1))/$${BUILDKITE_PARALLEL_JOB_COUNT}
